[Service]
# Codex descendants (including browser processes) inherit gpt.service's
# cgroup. Reclaim above the soft ceiling; if a turn still runs away, contain
# the OOM to this unit and let Restart=always bring the bot back cleanly.
MemoryAccounting=yes
MemoryHigh=4G
MemoryMax=5G
MemorySwapMax=512M
OOMPolicy=kill
